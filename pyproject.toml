[project]
name = "delivery-archaeology"
version = "1.0.2"
description = "Command-line delivery-system analysis using Jira and GitHub."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    "scipy>=1.13.0",
    "typer>=0.12.0",
]

[project.scripts]
delivery = "delivery_archaeology.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
